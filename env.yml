name: timeseries_aug
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11  # More stable version for PyTorch
  - pytorch=2.1  # Compatible PyTorch version
  - pip
  - pip:
      - hydra-core==1.3.2  # Configuration management with Hydra
      - numpy<2  # Ensures compatibility with packages requiring NumPy 1.x
      - pandas  # Data processing
      - matplotlib  # Time series visualization
      - scikit-learn  # Machine learning utilities
      - -e .  # Install the project in development mode
