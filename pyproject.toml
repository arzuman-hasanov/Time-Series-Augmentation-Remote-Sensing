[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries_augmentations"
version = "0.1.0"
description = "Data augmentation for time series processing"
dependencies = [
    "torch>=2.1",  # Compatible avec CPU et évite PyTorch 2.4 (pas encore stable)
    "scikit-learn",
    "hydra-core>=1.3.2",
    "pandas",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
gpu = [
    "pytorch-cuda>=12.1",
]
full = [
    "pytorch-cuda>=12.1",
    "tensorboard",
    "neptune>=1.13.0",
]

[tool.setuptools]
packages = ["timeseries_augmentations"]
